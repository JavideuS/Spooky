# maps/urban_plaza.yaml

map:
  path: urban_plaza.h5
  # Optional: "matrix" (default, omit this line) or "cartesian". Spooky's
  # generated .h5 is always matrix (row, col), row 0 = top — maps are static
  # baked arrays, not something with a runtime coordinate_format like robot
  # positions. Set this to "cartesian" only if you find it more natural to
  # author obstacles/positions/regions below as (x, y) with y increasing
  # upward; generate_map_from_yaml() re-indexes them to matrix once, at
  # generation time, before writing the .h5 (see yaml2HDF5.flip_map_config_to_matrix).
  # coordinate_format: cartesian
  grid:
    M: 5
    N: 5
    obstacles: []  # Static obstacles (rarely changes)

  # Terrain: base material + exceptions
  terrain:
    base_material: ceramic
    # List of overrides (more scalable than full matrix)
    modifications:
      - positions:
          - [0, 0]
          - [0, 1]
        type: water
      - region:
          start: [1, 0]
          end: [2, 1]  # inclusive
        type: asphalt

  # Elevation: base height + local changes
  elevation:
    base_height: 0.0
    modifications:
      - positions:
          - [0, 0]
          - [0, 1]
        height: 0.5
      - positions:
          - [1, 0]
        height: 0.3

# Planning problems (multiple per file)
problems:
  # Single robot problem (legacy format)
  baseline:
    start: [0, 2]
    goal: [4, 2]
    time_limit: null  # YAML for None

  # Multi-robot problem (new format)
  multi_robot_baseline:
    time_limit: 20
    robots:
      robot_0:
        start: [0, 0]
        goal: [4, 4]
        start_time: 0
        priority: 1.0
        safety_radius: 0.5
      robot_1:
        start: [4, 0]
        goal: [0, 4]
        start_time: 0
        priority: 1.0
        safety_radius: 0.5
      robot_2:
        start: [0, 4]
        goal: [4, 0]
        start_time: 2
        priority: 1.5
        safety_radius: 0.5

  # Single robot with dynamic obstacles
  with_pedestrians:
    start: [0, 2]
    goal: [4, 2]
    time_limit: 20
    dynamic_obstacles:
      - id: ped1
        type: pedestrian
        path:
          - [2, 1]
          - [3, 1]
          - [4, 1]
        speed: 1.0
        start_time: 2
        loop: false

      - id: ped2
        type: pedestrian
        path:
          - [2, 3]
          - [1, 3]
          - [0, 3]
        speed: 0.8
        start_time: 0

  # Multi-robot with staggered start times
  rush_hour:
    time_limit: 25
    robots:
      delivery_1:
        start: [0, 2]
        goal: [4, 2]
        start_time: 0
        priority: 1.0
      delivery_2:
        start: [1, 0]
        goal: [3, 4]
        start_time: 3
        priority: 1.2
      delivery_3:
        start: [4, 1]
        goal: [0, 3]
        start_time: 5
        priority: 0.8