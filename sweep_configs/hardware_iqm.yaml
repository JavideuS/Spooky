# IQM Garnet subset of hardware_first.yaml (same pipeline and windows).
#   spooky-sweep --config sweep_configs/hardware_iqm.yaml --dry-run
#   spooky-sweep --config sweep_configs/hardware_iqm.yaml \
#       --enable-hardware --confirm-hardware-quota "yes-spend-quota"
#
# Subset for a ~25-credit budget: billing looked like 0.5 credit per second
# (rounded up, 0.5 minimum) and these four single-robot problems are ~30
# jobs per run. Two-robot and 10x10 problems (10-32 jobs each) don't fit.
# fail_fast: a declined job (credits out) stops the sweep instead of every
# later problem queueing and failing too.

sweep:
  id: null
  seed: 42
  enable_hardware: true
  output_root: results/sweeps

instances:
  - map: quantum/maps/synthetic/3x3/obs3x3_standard
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/no_obs5x5
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_easy
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_medium
    problems: [baseline]
    builder: grid

solvers:
  - name: qaoa_iqm_garnet
    backend: pennylane
    params:
      { device: qiskit.iqm, machine: garnet, normalize_scale: 4.0, layers: 2, num_reads: auto, use_session: false }
    penalty_set: trailing
    var_limit: 20
    num_runs: 1
    hardware: true

execution:
  preprocess_default: bfs_safe
  fail_fast: true
