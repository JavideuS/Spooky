# First real-hardware sweep: fixed-angle QAOA sampling on IBM, with SA and a
# noiseless simulator on the same pipeline. IQM runs separately
# (hardware_iqm.yaml): its credit budget only covers a subset.
#   spooky-sweep --config sweep_configs/hardware_first.yaml --dry-run
#   spooky-sweep --config sweep_configs/hardware_first.yaml \
#       --enable-hardware --confirm-hardware-quota "yes-spend-quota"
#
# bfs_safe: under full, pinning decides most windows and hardware barely runs.
# var_limit 20: every window fits IQM Garnet too, so both sweeps share windows.
# Three-robot problems excluded: 15-16 qubit windows, ~100k shots per run.
# trailing: crash has no swap term, and bfs_safe has no fixer swap check.
# No run_timeout_sec: hardware queues can be long; don't kill a billed job.

sweep:
  id: null
  seed: 42
  enable_hardware: true
  output_root: results/sweeps

instances:
  - map: quantum/maps/synthetic/3x3/obs3x3_standard
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/no_obs5x5
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_easy
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_medium
    problems: [baseline, two_robots]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_hard
    problems: [baseline, two_robots]
    builder: grid
  - map: quantum/maps/synthetic/10x10/no_obs10x10
    problems: [baseline]
    builder: grid

solvers:
  - name: sa_neal_safe
    backend: dwave
    params: { normalize_scale: 4, num_reads: 4 }
    penalty_set: trailing
    var_limit: 20
    num_runs: 5

  - name: qaoa_sim_safe
    backend: pennylane
    params:
      { device: lightning.qubit, normalize_scale: 4.0, layers: 2, num_reads: auto }
    penalty_set: trailing
    var_limit: 20
    num_runs: 5

  - name: qaoa_ibm
    backend: pennylane
    params:
      { device: qiskit.remote, normalize_scale: 4.0, layers: 2, num_reads: auto, use_session: false }
    penalty_set: trailing
    var_limit: 20
    num_runs: 2
    hardware: true

execution:
  preprocess_default: bfs_safe
  fail_fast: false
