# Two-robot problem on IQM Garnet (IBM ran it in hardware_first.yaml) plus
# two more IBM runs of it, to compare vendors on a harder window.
#   spooky-sweep --config sweep_configs/small_hardware.yaml --dry-run
#   spooky-sweep --config sweep_configs/small_hardware.yaml \
#       --enable-hardware --confirm-hardware-quota "yes-spend-quota"
#
# Sized to what was left after hardware_first/hardware_iqm: ~12 jobs per run
# (Garnet ~6-10 credits, IBM ~25 s per run).

sweep:
  id: null
  seed: 42
  enable_hardware: true
  output_root: results/sweeps

instances:
  - map: quantum/maps/synthetic/5x5/obs5x5_medium
    problems: [two_robots]
    builder: grid

solvers:
  - name: qaoa_iqm_garnet
    backend: pennylane
    params:
      { device: qiskit.iqm, machine: garnet, normalize_scale: 4.0, layers: 2, num_reads: auto, use_session: false }
    penalty_set: trailing
    var_limit: 20
    num_runs: 1
    hardware: true

  - name: qaoa_ibm
    backend: pennylane
    params:
      { device: qiskit.remote, normalize_scale: 4.0, layers: 2, num_reads: auto, use_session: false }
    penalty_set: trailing
    var_limit: 20
    num_runs: 2
    hardware: true

execution:
  preprocess_default: bfs_safe
  fail_fast: true
