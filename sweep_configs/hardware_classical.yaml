# Classical references for the hardware sweeps: hardware_first.yaml's 8
# problems with exact solvers, and SA / the noiseless QAOA simulator under both
# preprocess modes, on the same var_limit and penalty set.
#   spooky-sweep --config sweep_configs/hardware_classical.yaml --dry-run
#   spooky-sweep --config sweep_configs/hardware_classical.yaml

sweep:
  id: null
  seed: 42
  enable_hardware: false
  output_root: results/sweeps

instances:
  - map: quantum/maps/synthetic/3x3/obs3x3_standard
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/no_obs5x5
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_easy
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_medium
    problems: [baseline, two_robots]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_hard
    problems: [baseline, two_robots]
    builder: grid
  - map: quantum/maps/synthetic/10x10/no_obs10x10
    problems: [baseline]
    builder: grid

solvers:
  - name: ilp_highs
    backend: ilp
    params: { time_limit: 120 }
    num_runs: 1

  - name: cbs
    backend: cbs
    params: { node_limit: 5000, time_limit: 120 }
    num_runs: 1

  - name: sa_neal
    backend: dwave
    params: { normalize_scale: 4, num_reads: 4 }
    penalty_set: trailing
    var_limit: 20
    num_runs: 10
    ablation: { preprocess: [full, bfs_safe] }

  - name: qaoa_sim
    backend: pennylane
    params:
      { device: lightning.qubit, normalize_scale: 4.0, layers: 2, num_reads: auto }
    penalty_set: trailing
    var_limit: 20
    num_runs: 5
    ablation: { preprocess: [full, bfs_safe] }

execution:
  run_timeout_sec: 300
  preprocess_default: bfs_safe
  fail_fast: false
