# Pre-processing ablation — the control for classical_test.yaml.
#
# classical_test.yaml answers "how do the backends compare". This answers
# "how much of that was the solver and how much was pre-processing", by
# running every backend across the pre-processing modes instead of one
# setting. Run it first: it is far cheaper and it says how much of the
# comparison is worth reading.
#
#   spooky-sweep --config sweep_configs/classical_test_ablation.yaml
#
# What the modes isolate (quantum/utils/preprocess.py has the full table):
#   bfs_safe vs bfs_aggressive   is aggressive pruning costing correct answers
#   full     vs bfs_aggressive   what numerical fixing is worth
#   raw                          the old preprocess=false -- a different loop,
#                                not "the same one with reductions off", so
#                                it is on sa_neal only and attributes nothing
#
# Instance scope: the 3x3s are single-robot, so they cannot test bfs_safe at
# all -- it exists to preserve waiting, and waiting only matters when robots
# yield. The 5x5 multi-robot pairs are what exercise it.
#
# qaoa_sim carries var_limit 20 so its pruning-only modes fit a simulator.
# That cap is what makes them runnable at all -- at the default var_limit the
# same runs die with bad_alloc on both lightning devices.

sweep:
  id: null # auto-generated sweep_<timestamp>_<hex8> if omitted
  seed: 42
  enable_hardware: false
  output_root: results/sweeps

instances:
  - map: quantum/maps/synthetic/3x3/no_obs3x3
    problems: [baseline]
    builder: grid
  - map: quantum/maps/synthetic/3x3/obs3x3_standard
    problems: [baseline]
    builder: grid

  # Multi-robot: bfs_safe exists to preserve waiting, and waiting only
  # matters when robots yield to each other -- the 3x3s above are all
  # single-robot and cannot test it. obs5x5_easy/three_robots is also the
  # regression case for the diag-fixing collision fix (was 0/10).
  # qaoa_sim cannot run the pruning-only modes here: 5x5 multi-robot windows
  # exceed the simulator on both lightning.qubit and lightning.gpu, so its
  # bfs_* rows fail with bad_alloc in a few seconds and only `full` reports.
  - map: quantum/maps/synthetic/5x5/obs5x5_easy
    problems: [two_robots, three_robots]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_medium
    problems: [three_robots]
    builder: grid
  - map: quantum/maps/synthetic/5x5/obs5x5_hard
    problems: [two_robots]
    builder: grid

solvers:
  - name: ilp_highs
    backend: ilp
    params: { time_limit: 60 }
    num_runs: 1
    ablation: { preprocess: [true, false] }

  - name: cbs
    backend: cbs
    params: { node_limit: 5000, time_limit: 60 }
    num_runs: 1
    ablation: { preprocess: [true, false] }

  - name: sa_neal
    backend: dwave
    params: { normalize_scale: 4, num_reads: 4 }
    penalty_set: crash
    num_runs: 10
    # raw is here only on SA, where it costs 0.13-0.32s per run. It is not a
    # clean no-pre-processing control (see the note above), but it is the only
    # mode whose variable count is the real problem size, and every reduction
    # ratio the other modes report is implicitly measured against it. It is
    # off qaoa_sim because there it only produces a std::bad_alloc and no
    # variable_stats at all.
    #
    # For the scaling curve itself prefer the build-only measurement, which
    # needs no solver and so reaches the instances nothing here can finish:
    #   python -m quantum.benchmark.analysis.run_variable_scaling \
    #       --config sweep_configs/classical_test.yaml
    ablation: { preprocess: [raw, bfs_aggressive, bfs_safe, full] }

  - name: qaoa_sim
    backend: pennylane
    params:
      device: lightning.qubit
      normalize_scale: 1.0
      layers: 2
      optimizer: QNG
      opt_steps: 30
    penalty_set: crash
    # 20 is the largest cap measured to run preprocess=false without
    # exhausting memory, and >= 9 so a 3x3 timestep still fits in a window.
    # It applies to the preprocess=true arm too, which keeps the two arms
    # comparable — the only thing varying between them is the BFS.
    var_limit: 20
    num_runs: 10
    # bfs_safe is likely to price QAOA out even at 3x3 -- it is here to find
    # out where the ceiling is, and an out-of-memory failure is a result.
    ablation: { preprocess: [bfs_aggressive, bfs_safe, full] }

execution:
  run_timeout_sec: 300
  preprocess_default: true
  fail_fast: false
