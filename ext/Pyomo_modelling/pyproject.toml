[project]
name = "pyomo-modelling"
version = "0.1.0"
description = "Pyomo modelling utilities"
requires-python = ">=3.7"
dependencies = [
	"pyomo",
    "numpy",
    "dwave-neal",
    "dwave-ocean-sdk",
    "dwave_networkx",
    "minorminer",
    "dimod",
    "cvxpy",
    "sympy",
]

[build-system]
requires = ["uv_build>=0.9.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "modelling_functions"