# Optional: defaults per backend
_defaults:
  dwave: &dwave_defaults
    backend: "dwave"
  pennylane: &pennylane_defaults
    backend: "pennylane"
    device: "lightning.qubit"


# Main solver profiles
solvers:
  dwave:
    3x3:
      <<: *dwave_defaults
      normalization_scale: 2.0
      num_reads: 15
    5x5:
      <<: *dwave_defaults
      normalization_scale: 1.0
      num_reads: 35
      # Add metadata
      description: "Low-read D-Wave for small maps"
      tags: ["dwave", "fast", "small"]
      cache_instance: true
      experimental: false

  pennylane:
    qaoa_QNG:
      <<: *pennylane_defaults
      normalization_scale: 2.0
      num_reads: 800
      layers: 2
      optimizer: "QNG"
      opt_steps: 30
    qaoa_SPSA:
      <<: *pennylane_defaults
      normalization_scale: 2.0
      num_reads: 800
      layers: 2
      optimizer: "SPSA"
      opt_steps: 30


# Optional: aliases for backward compatibility or simplicity
aliases:
  dwave_3x3: dwave.3x3
  dwave_5x5: dwave.5x5
  pennylane_qaoa_QNG: pennylane.qaoa_QNG
  pennylane_qaoa_SPSA: pennylane.qaoa_SPSA

