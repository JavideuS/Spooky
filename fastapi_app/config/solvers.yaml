# Optional: defaults per backend
_defaults:
  dwave: &dwave_defaults
    backend: "dwave"
  pennylane_gpu: &pennylane_gpu_defaults
    backend: "pennylane"
    device: "lightning.gpu"
  pennylane_cpu: &pennylane_cpu_defaults
    backend: "pennylane"
    device: "lightning.qubit"
  pennylane_qiskit: &pennylane_qiskit_defaults
    backend: "pennylane"
    device: "qiskit.remote"
  pennylane_iqm: &pennylane_iqm_defaults
    backend: "pennylane"
    device: "qiskit.iqm"
  ilp: &ilp_defaults
    backend: "ilp"
  cbs: &cbs_defaults
    backend: "cbs"

# Main solver profiles
solvers:
  dwave:
    fast:
      <<: *dwave_defaults
      normalization_scale: 1.0
      num_reads: 4
      description: "Speed over accuracy: 4 reads per window whatever its size"
      tags: ["dwave", "fast", "small maps"]
    general:
      <<: *dwave_defaults
      normalization_scale: 1.0
      num_reads: "auto"
      description: "Calibrated read budget: max(4, vars/2) reads per window"
      tags: ["dwave", "general", "Safe"]

  pennylane:
    inference:
      qaoa_qiskit:
        <<: *pennylane_qiskit_defaults
        normalization_scale: 2.0
        num_reads: 3000
        layers: 2
        tags: ["pennylane", "qiskit", "real hardware"]
        description: "To test circuits and scenarios on real quantum hardware. Note you need to set IBM Quantum first"

      qaoa_iqm:
        <<: *pennylane_iqm_defaults
        normalization_scale: 4.0
        num_reads: 3000
        layers: 2
        tags: ["pennylane", "iqm", "real hardware"]
        description: "To test circuits and scenarios on real IQM hardware via Resonance (auto-picks the smallest machine that fits — Garnet or Emerald; Sirius isn't supported yet). Requires IQM_TOKEN in your environment/.env. Set 'machine' to pin a specific device instead of auto-picking."

      # Simulators run the tuned 2-layer angles (TUNED_ANGLES_2_LAYERS), which
      # assume scale 1, and the calibrated shot table (num_reads "auto").
      qaoa_GPU_general:
        <<: *pennylane_gpu_defaults
        normalization_scale: 1.0
        num_reads: "auto"
        layers: 2
        tags: ["pennylane", "general", "<25 qubits"]
        description: "Statevector memory becomes the limit past ~25 qubits"
      qaoa_CPU_general:
        <<: *pennylane_cpu_defaults
        normalization_scale: 1.0
        num_reads: "auto"
        layers: 2
        tags: ["pennylane", "general", "<25 qubits", "CPU"]
        description: "lightning.qubit equivalent of qaoa_GPU_general, for Windows/CPU only devices"

  classic:
    ilp:
      <<: *ilp_defaults
      description: "Exact classical MILP solver (Pyomo/HiGHS) — always finds the optimal solution, no windowing/sampling"
      tags: ["classical", "ilp", "exact", "no quantum"]
    cbs:
      <<: *cbs_defaults
      description: "CBS algorithm for multi-agent pathfinding"
      tags: ["classical", "cbs", "fast", "exact"]
